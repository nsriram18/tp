plugins {
    id 'java'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'application'
    id 'jacoco'
}

import java.nio.ByteBuffer
import java.nio.ByteOrder

def javaFxVersion = '17.0.7'

configurations {
    macArmJavaFx {
        transitive = false
    }
}

application {
    mainClass = 'seedu.address.Main'
    applicationDefaultJvmArgs = ['-ea']
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

checkstyle {
    toolVersion = '14.1.0'
}

run {
    enableAssertions = true
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

task coverage(type: JacocoReport) {
    dependsOn test
    sourceDirectories.from files(sourceSets.main.allSource.srcDirs)
    classDirectories.from files(sourceSets.main.output)
    executionData.from files(jacocoTestReport.executionData)
    afterEvaluate {
        classDirectories.from files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/*.jar'])
        })
    }
    reports {
        html.required = true
        xml.required = true
    }
}

dependencies {
    String jUnitVersion = '5.14.4'
    implementation "org.openjfx:javafx-base:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-base:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-base:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:linux"
    macArmJavaFx "org.openjfx:javafx-graphics:${javaFxVersion}:mac-aarch64"

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.7.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.7.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

def universalMacNatives = tasks.register('universalMacNatives') {
    def outputDirectory = layout.buildDirectory.dir('universalMacNatives')
    inputs.files(configurations.runtimeClasspath, configurations.macArmJavaFx)
    outputs.dir(outputDirectory)

    doLast {
        File intelJar = configurations.runtimeClasspath.files.find {
            it.name == "javafx-graphics-${javaFxVersion}-mac.jar"
        }
        if (intelJar == null) {
            throw new GradleException('Intel macOS JavaFX graphics dependency is missing')
        }
        File armJar = configurations.macArmJavaFx.singleFile
        def intelLibraries = zipTree(intelJar).matching { include '*.dylib' }.files
        def armLibraries = zipTree(armJar).matching { include '*.dylib' }.files.collectEntries {
            [(it.name): it]
        }
        File output = outputDirectory.get().asFile
        output.mkdirs()

        intelLibraries.each { File intelLibrary ->
            File armLibrary = armLibraries[intelLibrary.name]
            if (armLibrary == null) {
                throw new GradleException("ARM macOS JavaFX library is missing: ${intelLibrary.name}")
            }
            byte[] intelBytes = intelLibrary.bytes
            byte[] armBytes = armLibrary.bytes
            def architecture = { byte[] bytes ->
                ByteBuffer header = ByteBuffer.wrap(bytes).order(ByteOrder.LITTLE_ENDIAN)
                if (header.getInt(0) != (int) 0xfeedfacf) {
                    throw new GradleException("Expected a 64-bit Mach-O library: ${intelLibrary.name}")
                }
                [header.getInt(4), header.getInt(8)]
            }
            def intelArch = architecture(intelBytes)
            def armArch = architecture(armBytes)
            // A fat Mach-O header points to each native slice at a 16 KiB boundary.
            int alignment = 16384
            int firstOffset = alignment
            int secondOffset = ((firstOffset + intelBytes.length + alignment - 1).intdiv(alignment)) * alignment

            new DataOutputStream(new FileOutputStream(new File(output, intelLibrary.name))).withCloseable { stream ->
                stream.writeInt((int) 0xcafebabe)
                stream.writeInt(2)
                stream.writeInt(intelArch[0]); stream.writeInt(intelArch[1])
                stream.writeInt(firstOffset); stream.writeInt(intelBytes.length); stream.writeInt(14)
                stream.writeInt(armArch[0]); stream.writeInt(armArch[1])
                stream.writeInt(secondOffset); stream.writeInt(armBytes.length); stream.writeInt(14)
                stream.write(new byte[firstOffset - 48])
                stream.write(intelBytes)
                stream.write(new byte[secondOffset - firstOffset - intelBytes.length])
                stream.write(armBytes)
            }
        }
    }
}

shadowJar {
    archiveFileName = 'TutorTrack.jar'
    dependsOn universalMacNatives
    eachFile { details ->
        if (details.name.endsWith('.dylib') && !details.file.path.contains('universalMacNatives')) {
            details.exclude()
        }
    }
    from(universalMacNatives) {
        include '*.dylib'
    }
}

defaultTasks 'clean', 'test'
